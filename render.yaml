services:
  - type: web
    name: training-reminder-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python web_app.py
    healthCheckPath: /healthz
    disk:
      name: reminders-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: cloud
      - key: APP_DATA_DIR
        value: /var/data
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SMTP_ENCRYPTION_KEY
        sync: false
