<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training Desk · Sign in</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#172923; background:#f3f6f2; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; }
    .card { width:min(100%, 430px); background:white; border:1px solid #e2e8e2; border-radius:22px; padding:34px; box-shadow:0 18px 55px #18372d12; }
    .brand { display:flex; align-items:center; gap:11px; color:#27634f; font-weight:800; letter-spacing:.12em; font-size:12px; }
    .mark { width:38px; height:38px; display:grid; place-items:center; color:white; background:#27634f; border-radius:12px; font-size:19px; }
    h1 { font-size:29px; letter-spacing:-.04em; margin:28px 0 8px; }
    .sub { color:#718078; line-height:1.55; margin:0 0 23px; font-size:14px; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:5px; margin-bottom:20px; background:#f1f4f1; border-radius:12px; }
    .tab { border:0; padding:10px; border-radius:9px; color:#617069; background:transparent; font:inherit; cursor:pointer; }
    .tab[aria-selected="true"] { color:#205b47; background:white; box-shadow:0 1px 4px #16291d16; font-weight:700; }
    label { display:block; margin:15px 0 7px; color:#58665f; font-size:13px; font-weight:700; }
    input { width:100%; height:47px; border:1px solid #dce3dd; border-radius:11px; padding:0 13px; font:inherit; outline:none; }
    input:focus { border-color:#37836a; box-shadow:0 0 0 3px #37836a1c; }
    .submit { width:100%; height:48px; margin-top:23px; color:white; border:0; border-radius:11px; background:#24644e; font:inherit; font-weight:750; cursor:pointer; }
    .submit:disabled { opacity:.65; cursor:wait; }
    .hint { margin:12px 0 0; color:#859088; font-size:12px; line-height:1.5; }
    .error { min-height:20px; margin:12px 0 0; color:#a43737; font-size:13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">↗</span><span>TRAINING DESK</span></div>
    <h1 id="title">Welcome back</h1>
    <p class="sub">Sign in to manage your training reminders, or create an account to get started.</p>
    <div class="tabs" role="tablist" aria-label="Account access">
      <button class="tab" id="loginTab" role="tab" aria-selected="true" type="button">Sign in</button>
      <button class="tab" id="registerTab" role="tab" aria-selected="false" type="button">Create account</button>
    </div>
    <form id="accountForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div id="confirmGroup" hidden>
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password">
      </div>
      <p class="hint" id="hint" hidden>Use at least 12 characters. Your reminders and email settings are kept separate from other accounts.</p>
      <button class="submit" id="submitButton" type="submit">Sign in</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector('#accountForm');
    const loginTab = document.querySelector('#loginTab');
    const registerTab = document.querySelector('#registerTab');
    let mode = 'login';
    function choose(next) {
      mode = next;
      const registering = mode === 'register';
      loginTab.setAttribute('aria-selected', String(!registering));
      registerTab.setAttribute('aria-selected', String(registering));
      document.querySelector('#title').textContent = registering ? 'Create your account' : 'Welcome back';
      document.querySelector('#submitButton').textContent = registering ? 'Create account' : 'Sign in';
      document.querySelector('#password').autocomplete = registering ? 'new-password' : 'current-password';
      document.querySelector('#password').minLength = registering ? 12 : 1;
      document.querySelector('#confirmGroup').hidden = !registering;
      document.querySelector('#confirmPassword').required = registering;
      document.querySelector('#hint').hidden = !registering;
      document.querySelector('#error').textContent = '';
    }
    loginTab.addEventListener('click', () => choose('login'));
    registerTab.addEventListener('click', () => choose('register'));
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.querySelector('#username').value.trim();
      const password = document.querySelector('#password').value;
      const button = document.querySelector('#submitButton');
      const error = document.querySelector('#error');
      if (mode === 'register' && password !== document.querySelector('#confirmPassword').value) {
        error.textContent = 'The passwords do not match.';
        return;
      }
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch(`/api/auth/${mode}`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({username, password})
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not sign in.');
        window.location.replace('/');
      } catch (err) {
        error.textContent = err.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
